<div class="studio-actions">

  <div class="valid-badge">
    <span class="material-symbols-outlined">
      check_circle
    </span>

    <span>
      Model Valid
    </span>
  </div>


  <button
    type="button"
    class="action-button"
    (click)="select('save')"
  >
    <span class="material-symbols-outlined">
      save
    </span>

    <span>Save</span>
  </button>


  <button
    type="button"
    class="action-button"
    (click)="select('view-specification')"
  >
    <span class="material-symbols-outlined">
      data_object
    </span>

    <span>View Specification</span>
  </button>


  <button
    type="button"
    class="more-button"
    aria-label="More actions"
    (click)="select('more')"
  >
    <span class="material-symbols-outlined">
      more_vert
    </span>
  </button>

</div>
