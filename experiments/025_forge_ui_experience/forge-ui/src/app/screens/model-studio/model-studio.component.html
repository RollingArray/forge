<div class="studio-shell">
  <app-forge-sidebar />

  <main class="studio-workspace">
    <app-studio-header />

    <section class="studio-toolbar">
      <app-workflow-stepper
        [steps]="steps"
        [activeStep]="activeStep()"
        (stepSelected)="selectStep($event)"
      />

      <app-studio-actions
        (actionSelected)="handleAction($event)"
      />
    </section>

    <section class="studio-body">
      <div class="canvas-area">
        <app-model-toolbar
          (actionSelected)="handleCanvasAction($event)"
        />

        <app-model-canvas
          [entities]="entities()"
          [relationships]="relationships()"
          [selectedEntity]="selectedEntity()"
          (entitySelected)="handleEntitySelected($event)"
        />
      </div>

      @if (selectedEntityData(); as entity) {
        <app-entity-inspector
          [entity]="entity"
          [entities]="entities()"
          [relationships]="relationships()"
          [constraints]="constraints()"
          (entityUpdated)="updateEntity($event)"
          (fieldAdded)="addField($event)"
          (relationshipAdded)="addRelationship($event)"
          (constraintAdded)="addConstraint($event)"
        />
      }
    </section>

    <footer class="workflow-actions">
      <div class="workflow-status">
        <span class="material-symbols-outlined">
          check_circle
        </span>

        <span>Model is ready</span>
      </div>

      <button
        type="button"
        class="workflow-primary-action"
        (click)="handleAction('continue-population')"
      >
        <span>Continue to Population Plan</span>

        <span class="material-symbols-outlined">
          arrow_forward
        </span>
      </button>
    </footer>
  </main>
</div>
