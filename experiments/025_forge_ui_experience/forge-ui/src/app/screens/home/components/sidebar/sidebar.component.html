<aside class="sidebar">

  <div class="sidebar-brand">

    <div class="brand-mark">
      <div class="brand-mark-top"></div>
      <div class="brand-mark-middle"></div>
      <div class="brand-mark-bottom"></div>
    </div>

    <span>FORGE</span>

  </div>


  <div class="sidebar-nav-scroll">
    <nav class="sidebar-nav">

    <button
      type="button"
      class="nav-item active"
      (click)="select('home')"
    >
      <span class="material-symbols-outlined">
        home
      </span>

      <span>Home</span>
    </button>


    <button
      type="button"
      class="nav-item"
      (click)="select('sessions')"
    >
      <span class="material-symbols-outlined">
        folder_open
      </span>

      <span>My Sessions</span>
    </button>


    <button
      type="button"
      class="nav-item"
      (click)="select('templates')"
    >
      <span class="material-symbols-outlined">
        redeem
      </span>

      <span>Templates</span>
    </button>


    <button
      type="button"
      class="nav-item"
      (click)="select('shared')"
    >
      <span class="material-symbols-outlined">
        group
      </span>

      <span>Shared with Me</span>
    </button>


    <div class="nav-divider"></div>


    <button
      type="button"
      class="nav-item"
      (click)="select('settings')"
    >
      <span class="material-symbols-outlined">
        settings
      </span>

      <span>Settings</span>
    </button>

    </nav>
  </div>


  <button
    type="button"
    class="organization-card"
    (click)="select('organization')"
  >

    <div class="organization-icon">

      <span class="material-symbols-outlined">
        corporate_fare
      </span>

    </div>


    <div class="organization-copy">

      <strong>
        Collins Aerospace
      </strong>

      <span>
        Enterprise
      </span>

    </div>


    <span class="material-symbols-outlined organization-arrow">
      expand_more
    </span>

  </button>

</aside>
