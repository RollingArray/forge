<div class="activity-item">
  <div class="activity-icon">
    <span class="material-symbols-outlined">
      {{ activity().icon }}
    </span>
  </div>

  <div class="activity-content">
    <p class="activity-action">
      {{ activity().action }}
    </p>

    <p class="activity-session">
      {{ activity().session }}
    </p>

    <span class="activity-time">
      {{ activity().time }}
    </span>
  </div>
</div>
