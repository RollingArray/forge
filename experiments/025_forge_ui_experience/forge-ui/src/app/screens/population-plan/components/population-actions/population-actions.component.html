<footer class="population-actions">

  <div class="action-context">

    <span class="material-symbols-outlined">
      fact_check
    </span>

    <div>
      <strong>
        Population plan ready for review
      </strong>

      <span>
        Review the resolved populations before continuing to generation.
      </span>
    </div>

  </div>

  <div class="action-buttons">

    <button
      type="button"
      class="secondary-button"
      (click)="select('back')"
    >
      <span class="material-symbols-outlined">
        arrow_back
      </span>

      <span>
        Back
      </span>
    </button>

    <button
      type="button"
      class="primary-button"
      (click)="select('review-accept')"
    >
      <span>
        Review &amp; Accept Plan
      </span>

      <span class="material-symbols-outlined">
        arrow_forward
      </span>
    </button>

  </div>

</footer>
