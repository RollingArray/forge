[project]
name = "forge"
version = "0.1.0"
description = "FORGE synthetic data generation platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "PyJWT>=2.10,<3.0",
    "psutil>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "truststore>=0.10,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
]
experiments = [
    "pandas>=3.0.5",
    "streamlit>=1.63.0",
]

[tool.uv]
package = false
