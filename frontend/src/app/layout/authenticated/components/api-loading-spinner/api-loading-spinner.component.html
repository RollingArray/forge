@if (apiLoadingService.isLoading()) {
  <div
    class="loading-spinner"
    role="status"
    aria-label="Loading"
    aria-live="polite"
  >
    <div class="spinner-content">
      <span class="spinner-ring"></span>
      <span class="spinner-label">{{ apiLoadingService.message() }}</span>
    </div>
  </div>
}
