<div class="forge-card canvas-shell">
  @if (empty()) {
    <div class="canvas-empty-state">
      <span class="material-symbols-outlined">account_tree</span>
      <h2>Start building your model</h2>
      <p>This Data Model does not have any entities yet.</p>
    </div>
  }

  <div #canvasViewport class="canvas-viewport" (scroll)="handleScroll()">
    <div class="canvas" [style.width.px]="canvasSize.width" [style.height.px]="canvasSize.height">
      <div class="canvas-grid"></div>

      <app-model-studio-relationship-layer
        [entities]="entities()"
        [relationships]="relationships()"
      />

      @for (entity of entities(); track entity.name) {
        <app-model-studio-entity-node
          [entity]="entity"
          [selected]="selectedEntity() === entity.name"
          [style.left.px]="entity.x"
          [style.top.px]="entity.y"
          (selectedChange)="selectEntity($event)"
        />
      }
    </div>
  </div>

  <app-model-studio-minimap [entities]="entities()" [viewport]="viewport()" />
</div>
