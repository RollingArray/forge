<main class="quality-page">
  <header class="quality-header">
    <button
      type="button"
      class="back-button"
      (click)="backToResults()"
    >
      <span class="material-symbols-outlined">arrow_back</span>
      <span>Back to Results</span>
    </button>

    <div class="quality-heading">
      <span class="eyebrow">Generation Quality</span>
      <h1>Detailed Quality Analysis</h1>
      <p>
        Detailed evidence of population fidelity, relationships,
        distributions, statistics, identity capacity, and performance.
      </p>
    </div>
  </header>

  <section class="quality-placeholder">
    <span class="material-symbols-outlined">analytics</span>
    <h2>Quality analysis</h2>
    <p>
      Detailed quality evidence will appear here.
    </p>
  </section>
</main>
