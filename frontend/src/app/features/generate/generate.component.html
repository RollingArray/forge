<app-workflow-page
  class="generate-workflow-page"
  [steps]="steps"
  [activeStep]="activeStep"
  [pageIcon]="'database'"
  [pageTitle]="'Synthetic Data Generation'"
  [pageDescription]="'Generate synthetic data from the validated model and accepted population plan.'"
  [progressLabel]="'4 of 5 steps'"
  [actionBarIcon]="'database'"
  [actionBarTitle]="
    generationLoading()
      ? 'Loading generation plan'
      : generationJob()?.status === 'RUNNING'
        ? 'Generation in progress'
        : generationJob()?.status === 'COMPLETED'
          ? 'Generation completed'
          : generationJob()?.status === 'FAILED'
            ? 'Generation failed'
            : generationReadiness()?.ready
              ? 'Generation is ready'
              : 'Generation is not ready'
  "
  [actionBarDescription]="
    generationLoading()
      ? 'Loading the generation plan from the backend.'
      : generationJob()?.status === 'RUNNING'
        ? 'Synthetic data is currently being generated.'
        : generationJob()?.status === 'COMPLETED'
          ? 'Generated data is ready for review.'
          : generationJob()?.status === 'FAILED'
            ? 'Generation could not be completed. Review the execution details.'
            : generationReadiness()?.ready
              ? 'Review the generation workspace before starting execution.'
              : 'Resolve the generation readiness issues before continuing.'
  "
  [secondaryLabel]="'Back to Population'"
  [secondaryIcon]="'arrow_back'"
  [primaryLabel]="
    generationJob()?.status === 'COMPLETED'
      ? 'Continue to Results'
      : generationJob()?.status === 'RUNNING'
        ? 'Generation in Progress'
        : generationJob()?.status === 'CREATED'
          ? 'Starting Generation'
          : generationJob()?.status === 'FAILED'
            ? 'Generation Failed'
            : 'Start Generation'
  "
  [primaryIcon]="'arrow_forward'"
  [primaryDisabled]="
    generationLoading() || (generationJob() !== null && generationJob()?.status !== 'COMPLETED')
  "
  (stepSelected)="selectStep($event)"
  (secondaryAction)="backToPopulation()"
  (primaryAction)="handlePrimaryAction()"
>
  <section class="generate-shell">
    <app-workflow-row [columns]="1">
      <app-workspace-section>
        <app-workspace-header
          eyebrow="GENERATION OVERVIEW"
          title="Generation metrics"
          summary="Current job, planned data volume, model size, and execution throughput."
        />
        <app-status-card
          class="generation-status-card"
          label="GENERATION STATUS"
          [title]="
            generationLoading()
              ? 'Loading generation'
              : generationError()
                ? 'Generation failed'
                : (generationJob()?.status ??
                  (generationReadiness()?.ready ? 'Ready to generate' : 'Not ready'))
          "
          [description]="
            generationError()
              ? generationError()!
              : generationLoading()
                ? 'Loading the canonical specification and generation plan.'
                : generationReadiness()?.ready
                  ? 'Generation readiness checks have passed.'
                  : 'Review generation readiness and resolve any outstanding requirements.'
          "
          [status]="
            generationLoading()
              ? 'info'
              : generationError()
                ? 'error'
                : generationJob()?.status === 'COMPLETED'
                  ? 'success'
                  : generationJob()?.status === 'FAILED'
                    ? 'error'
                    : generationJob()?.status === 'RUNNING'
                      ? 'info'
                      : generationReadiness()?.ready
                        ? 'success'
                        : 'warning'
          "
        />
        <app-metric-grid [columns]="4" [metrics]="generationMetrics()" />
      </app-workspace-section>
    </app-workflow-row>

    <app-workflow-row [columns]="'40-60'" class="generation-execution-row">
      <app-generation-pipeline
        [nodes]="pipelineNodes()"
        [loading]="generationLoading()"
        [ready]="generationReadiness()?.ready ?? false"
      />

      <app-entity-generation-progress
        [entities]="generationJob()?.entities ?? []"
        [totalGeneratedRows]="generationJob()?.total_generated_rows ?? 0"
        [totalTargetRows]="generationJob()?.total_target_rows ?? 0"
        [activeSemanticCall]="activeSemanticCall()"
      />
    </app-workflow-row>

    <aside class="generation-activity-panel">
      <app-generation-activity
        [activities]="generationActivities()"
        [isGenerating]="isGenerating()"
      />
    </aside>

    <app-workflow-row [columns]="1" class="generation-execution-row">
      <app-generation-checkpoint
        [checkpoint]="generationCheckpoint()"
        [loading]="generationCheckpointLoading()"
      />
    </app-workflow-row>
  </section>
</app-workflow-page>
