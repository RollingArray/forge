<app-workspace-section>
  <app-workspace-header
    eyebrow="Quality"
    title="Generation Quality"
    summary="How closely the generated dataset matches the intended model and data characteristics."
    [state]="quality() ? 'High Fidelity' : 'Unavailable'"
  />

  <app-metric-grid
    [columns]="3"
    [metrics]="metrics()"
  />

  <app-forge-button
    class="quality-details-action"
    label="Detailed quality analysis"
    icon="query_stats"
    variant="primary"
    title="Open detailed quality analysis"
    (clicked)="viewDetails.emit()"
  />
</app-workspace-section>
