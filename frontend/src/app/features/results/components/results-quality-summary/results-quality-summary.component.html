<app-workspace-section>
  <app-workspace-header
    eyebrow="Quality"
    title="Generation Quality"
    summary="How closely the generated dataset matches the intended model and data characteristics."
    [state]="quality() ? 'High Fidelity' : 'Unavailable'"
  />

  <app-metric-grid
    [columns]="3"
    [metrics]="metrics()"
  />

  <button
    type="button"
    class="forge-card toolbar-action toolbar-action-primary toolbar-action-with-label quality-details-button"
    (click)="viewDetails.emit()"
    title="Open detailed quality analysis"
  >
    <span class="analysis-action-icon material-symbols-outlined" aria-hidden="true">query_stats</span>
    <span class="analysis-action-label">Detailed quality analysis</span>
    <span class="analysis-action-arrow material-symbols-outlined" aria-hidden="true">arrow_forward</span>
  </button>
</app-workspace-section>
