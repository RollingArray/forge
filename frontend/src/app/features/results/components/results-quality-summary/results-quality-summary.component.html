<app-workspace-section>
  <app-workspace-header
    eyebrow="Quality"
    title="Generation Quality"
    summary="How closely the generated dataset matches the intended model and data characteristics."
    [state]="quality() ? 'High Fidelity' : 'Unavailable'"
  />

  <app-metric-grid
    [columns]="3"
    [metrics]="metrics()"
  />

  <button
    type="button"
    class="quality-details-button"
    disabled
    title="Detailed quality analysis will be available here."
  >
    <span>Detailed quality analysis</span>
    <span class="coming-soon">Coming soon</span>
  </button>
</app-workspace-section>
