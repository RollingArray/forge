<app-workspace-section>
  <app-workspace-header
    eyebrow="EXECUTION"
    title="Data Generation"
    summary="Review the execution outcome, generation performance, and dataset completion."
  />

  <div class="results-execution-success">
    <div class="results-execution-success-icon">
      <span class="material-symbols-outlined">check_circle</span>
    </div>

    <div class="results-execution-success-content">
      <strong>Generation completed</strong>

      <div class="results-execution-identity">
        <span>
          Job ID:
          <strong [title]="generationJob()?.job_id ?? jobId()">
            {{ generationJob()?.job_id ?? jobId() }}
          </strong>
        </span>

        <span>
          Model:
          <strong [title]="dataModelName() || '—'">
            {{ dataModelName() || '—' }}
          </strong>
        </span>
      </div>
    </div>
  </div>

  <app-metric-grid [columns]="4" [metrics]="metrics()" />

  <div class="results-execution-progress">
    <div class="results-execution-progress-track">
      <div
        class="results-execution-progress-fill"
        [style.width.%]="progress()"
      ></div>
    </div>

    <div class="results-execution-progress-meta">
      <span>
        {{ generationJob()?.total_generated_rows ?? 0 | number }}
        /
        {{ generationJob()?.total_target_rows ?? 0 | number }}
        rows generated
      </span>

      <strong>{{ progress() | number: '1.0-0' }}%</strong>
    </div>
  </div>
</app-workspace-section>
