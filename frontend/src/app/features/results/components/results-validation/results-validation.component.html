<app-workspace-section>
  <app-workspace-header
    eyebrow="Validation"
    title="Dataset Validation"
    summary="Deterministic checks performed against the generated dataset."
    [state]="validation()?.valid ? 'Valid' : 'Issues Found'"
  />

  <div class="validation-overview">
    <div class="forge-card validation-status">
      <div class="validation-status-icon">
        <span class="material-symbols-outlined">
          {{ validation()?.valid ? 'verified' : 'warning' }}
        </span>
      </div>

      <div class="validation-status-content">
        <strong>
          {{ validation()?.valid ? 'Validation passed' : 'Validation requires attention' }}
        </strong>

        <span>
          {{ validation()?.generated_rows | number }}
          of
          {{ validation()?.expected_rows | number }}
          requested rows validated
        </span>
      </div>
    </div>
  </div>

  <app-metric-grid [columns]="3" [metrics]="metrics()" />

  <button
    type="button"
    class="validation-details-button"
    disabled
    title="Detailed validation analysis will be available here."
  >
    <span>Detailed validation analysis</span>
    <span class="coming-soon">Coming soon</span>
  </button>
</app-workspace-section>
