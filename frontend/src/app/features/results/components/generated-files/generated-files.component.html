<ng-template #filenameTemplate let-value="value">
  <div class="results-file-name">
    <span class="file-type">CSV</span>
    <strong [title]="value">{{ value }}</strong>
  </div>
</ng-template>

<ng-template #sizeTemplate let-value="value">
  <span class="file-metric">
    {{ (value / 1024) | number:'1.0-1' }} KB
  </span>
</ng-template>

<ng-template #downloadTemplate let-row="row">
  <button
    type="button"
    class="file-download"
    (click)="downloadArtifact($event, row)"
    aria-label="Download generated file"
  >
    <span class="material-symbols-outlined">download</span>
  </button>
</ng-template>

<app-workspace-section>
  <app-workspace-header
    eyebrow="Generated Data"
    title="Generated Files"
    summary="Generated datasets are available for review and download."
    [state]="loading() ? 'Loading' : error() ? 'Unavailable' : 'Ready'"
  />

  @if (error()) {
    <div class="results-state results-state-error">{{ error() }}</div>
  } @else if (!loading()) {
    <app-workspace-simple-table
      [columns]="columns()"
      [rows]="artifacts()"
      rowKey="entity_name"
      [showSearch]="true"
      searchPlaceholder="Search files..."
      [searchValue]="searchTerm()"
      [summary]="allArtifactsCount() + (allArtifactsCount() === 1 ? ' file' : ' files')"
      summaryIcon="description"
      [selectable]="true"
      [selectedRowKey]="selectedArtifact()?.entity_name ?? null"
      emptyMessage="No generated files match your search."
      (searchValueChange)="updateSearchTerm($event)"
      (rowSelected)="selectTableRow($event)"
    />
  }
</app-workspace-section>
