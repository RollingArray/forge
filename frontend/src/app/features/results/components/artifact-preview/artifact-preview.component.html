<app-workspace-section>
  <app-workspace-header
    eyebrow="File Preview"
    [title]="artifact()?.filename || 'Generated File'"
    [summary]="
      artifact()
        ? (artifact()!.rows | number) + ' rows · ' +
          (artifact()!.size_bytes / 1024 | number:'1.0-1') + ' KB'
        : 'Select a generated file to preview its contents.'
    "
    [state]="loading() ? 'Loading' : artifact() ? 'Ready' : 'Waiting'"
  />

  @if (error()) {
    <div class="preview-state preview-state-error">
      {{ error() }}
    </div>
  } @else if (!loading() && !artifact()) {
    <div class="preview-state">
      Select a generated file to preview its contents.
    </div>
  } @else if (!loading() && preview()) {
    <app-workspace-simple-table
      [columns]="tableColumns()"
      [rows]="filteredRows()"
      [rowKey]="preview()!.columns[0]"
      [height]="'360px'"
      [showSearch]="true"
      searchPlaceholder="Search preview..."
      [searchValue]="searchTerm()"
      [summary]="
        searchTerm()
          ? filteredRows().length + ' of ' + preview()!.rows.length + ' preview rows'
          : preview()!.rows.length + ' preview rows'
      "
      summaryIcon="table_view"
      [toolbarActions]="[
        {
          id: 'download',
          icon: 'download',
          label: 'Download Data',
          variant: 'primary',
          disabled: !artifact(),
          tooltip: 'Download the complete generated file'
        }
      ]"
      emptyMessage="No preview rows match your search."
      (searchValueChange)="updateSearchTerm($event)"
      (toolbarAction)="download()"
    />
  }
</app-workspace-section>
