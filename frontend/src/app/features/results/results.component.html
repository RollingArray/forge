<app-workflow-page
  [steps]="steps"
  [activeStep]="activeStep"
  [pageIcon]="'bar_chart'"
  [pageTitle]="'Generation Results'"
  [pageDescription]="'Review the generated dataset and execution outcome.'"
  [progressLabel]="'5 of 5 steps'"
  [actionBarIcon]="'bar_chart'"
  [actionBarTitle]="'Generation completed'"
  [actionBarDescription]="'Generated data is ready for review and download.'"
  [secondaryLabel]="'Back to Generate'"
  [secondaryIcon]="'arrow_back'"
  [primaryLabel]="'Results Ready'"
  [primaryIcon]="'check'"
  [primaryDisabled]="true"
  (stepSelected)="selectStep($event)"
  (secondaryAction)="backToGenerate()"
>
  <app-results-execution-summary
    [generationJob]="generationJob()"
    [jobId]="jobId"
    [dataModelName]="dataModelName()"
  />

  <app-results-validation [validation]="generationJob()?.validation ?? null" />
  <app-results-quality-summary
    [quality]="generationJob()?.quality ?? null"
    (viewDetails)="viewQualityDetails()"
  />

  <app-workflow-row [columns]="2">
    <app-generated-files
      [artifacts]="filteredArtifacts()"
      [allArtifactsCount]="artifacts().length"
      [loading]="artifactsLoading()"
      [error]="artifactsError()"
      [selectedArtifact]="selectedArtifact()"
      [searchTerm]="searchTerm()"
      (searchTermChange)="updateSearchTerm($event)"
      (artifactSelected)="selectArtifact($event)"
      (downloadRequested)="downloadArtifact($event)"
    />

    <app-artifact-preview
      [artifact]="selectedArtifact()"
      [preview]="preview()"
      [loading]="previewLoading()"
      [error]="previewError()"
      (downloadRequested)="downloadArtifact($event)"
    />
  </app-workflow-row>
</app-workflow-page>
