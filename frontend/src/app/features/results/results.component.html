<main class="results-page">

  <header class="results-header">
    <div>
      <span class="section-eyebrow">Results</span>
      <h1>Generation Results</h1>
      <p>
        Review the generated dataset and execution outcome.
      </p>
    </div>
  </header>

  <section class="results-shell forge-card">
    <div class="results-shell-header">
      <div>
        <span class="section-eyebrow">Execution</span>
        <h2>Generation completed</h2>
      </div>

      <span class="section-state">Ready</span>
    </div>

    <div class="results-placeholder">
      <span class="results-placeholder-icon">✓</span>
      <h3>Results are ready</h3>
      <p>
        Generated data, execution metrics, and downloadable artifacts
        will appear here.
      </p>
    </div>
  </section>

</main>
