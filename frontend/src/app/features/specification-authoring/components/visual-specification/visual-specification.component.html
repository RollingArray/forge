<section class="visual-specification" aria-labelledby="visual-specification-heading">
  <app-workspace-header
    eyebrow="CANONICAL SPECIFICATION"
    [title]="displayValue(asRecord(specificationValue['model'])['name'])"
    [summary]="displayValue(asRecord(specificationValue['model'])['description'])"
    state="Visual review"
  />

  <app-metric-grid
    [columns]="3"
    [metrics]="[
      {
        label: 'Specification version',
        value: displayValue(specificationValue['version']),
        description: 'Canonical specification version',
        icon: 'schema',
      },
      {
        label: 'Vocabulary version',
        value: displayValue(specificationValue['vocabulary_version']),
        description: 'Specification vocabulary version',
        icon: 'menu_book',
      },
      {
        label: 'Entities',
        value: asArray(specificationValue['entities']).length,
        description: 'Entities defined in the model',
        icon: 'account_tree',
      },
      {
        label: 'Relationships',
        value: asArray(specificationValue['relationships']).length,
        description: 'Relationships defined in the model',
        icon: 'hub',
      },
      {
        label: 'Foreign keys',
        value: asArray(specificationValue['foreign_keys']).length,
        description: 'Foreign-key definitions',
        icon: 'link',
      },
      {
        label: 'Constraints',
        value: asArray(specificationValue['constraints']).length,
        description: 'Constraints defined in the model',
        icon: 'rule',
      },
    ]"
  />

  <app-generation-settings
    [generation]="specificationValue['generation']"
  />

  <app-entity-list [entities]="specificationValue['entities']" />

  <app-detail-sections [specification]="specificationValue" />

  <p class="visual-specification-footnote">
    This is a visual rendering of the proposed specification. It remains a draft; reviewing it here
    does not save or modify a Data Model.
  </p>
</section>
