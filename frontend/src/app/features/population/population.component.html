<app-workflow-page
  [steps]="steps"
  [activeStep]="activeStep"
  [pageIcon]="'groups'"
  [pageTitle]="'Population Plan'"
  [pageDescription]="'Plan the size and shape of the synthetic dataset while FORGE explains the model constraints.'"
  [progressLabel]="'Population'"
  [actionBarIcon]="'fact_check'"
  [actionBarTitle]="'Review population plan'"
  [actionBarDescription]="'Review the planned populations and model constraints before continuing to generation.'"
  [secondaryLabel]="'Back to Validation'"
  [secondaryIcon]="'arrow_back'"
  [primaryLabel]="'Review & Accept Plan'"
  [primaryIcon]="'arrow_forward'"
  (stepSelected)="selectStep($event)"
  (secondaryAction)="backToValidation()"
  (primaryAction)="reviewAndAcceptPlan()"
>
  @if (displayedPlan(); as plan) {
    <app-workflow-row [columns]="1">
      <app-population-summary
        [targetRows]="targetRows()"
        [resolvedRows]="resolvedRows()"
        [gapRows]="gapRows()"
        [feasibleCount]="feasibleCount()"
        [entityCount]="entityCount()"
        [isCandidate]="isCandidate()"
      />
    </app-workflow-row>

    <app-workflow-row [columns]="1">
      <app-population-target
        [targetRows]="targetRows()"
        [isDistributing]="isDistributing()"
        (targetChange)="setTarget($event)"
        (distribute)="distributeTarget()"
      />
    </app-workflow-row>

    @if (errorMessage(); as error) {
      <app-workflow-row [columns]="1">
        <section class="population-message population-message-error">
          <strong>Unable to build candidate plan</strong>
          <span>{{ error }}</span>
        </section>
      </app-workflow-row>
    }

    @if (candidatePlan(); as candidate) {
      <app-workflow-row [columns]="1">
        <app-population-candidate-decision
          [candidate]="candidate"
          [entityCount]="entityCount()"
        />
      </app-workflow-row>
    }

    <app-workflow-row [columns]="1">
      <app-entity-population-table
        [plan]="plan"
        [originalPlan]="populationPlan()!"
      />
    </app-workflow-row>
  } @else {
    <section class="loading-card">
      <h2>Loading population plan…</h2>
      <p>Loading the derived population plan from FORGE.</p>
    </section>
  }
</app-workflow-page>
