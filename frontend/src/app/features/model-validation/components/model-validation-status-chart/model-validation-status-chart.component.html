<app-workspace-section>
  <app-workspace-header
    eyebrow="OVERALL STATUS"
    title="Validation health"
    summary="Overall distribution of passed checks, warnings, and errors across the model."
  />

  <app-workspace-scroll-area>
    <app-chart
      type="doughnut"
      [labels]="chartLabels"
      [datasets]="chartDatasets()"
      [options]="chartOptions"
    />
  </app-workspace-scroll-area>
</app-workspace-section>
