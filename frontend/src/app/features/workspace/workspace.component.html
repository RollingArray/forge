<section class="workspace-page">
  <div class="workspace-body">
    <main class="center-panel">
      <div class="center-scroll-content">
        <app-workspace-welcome-header
          (newDataModel)="handleNewDataModel()"
        />

        <app-workspace-content
          [metrics]="metrics()"
          [dataModels]="dataModels()"
          [selectedDataModel]="selectedDataModel()"
          (newDataModel)="handleNewDataModel()"
          (dataModelSelected)="handleDataModelSelected($event)"
          (shareRequested)="handleDataModelShareRequested($event)"
        />
      </div>

      <div class="templates-dock">
        <app-workspace-templates
          [templates]="templates()"
          (templateSelected)="handleTemplateSelected($event)"
        />
      </div>
    </main>

    <app-workspace-right-rail
      [activities]="activities()"
      (quickActionSelected)="handleQuickAction($event)"
      (viewAllActivity)="handleViewAllActivity()"
      (documentationRequested)="handleDocumentation()"
    />
  </div>
</section>

@if (dataModelDialogOpen()) {
  <app-data-model-dialog
    [dataModel]="editingDataModel()"
    (saved)="handleDataModelSaved($event)"
    (deleted)="handleDataModelDeleted()"
    (closed)="closeDataModelDialog()"
  />
}

@if (dataModelShareDialogOpen() && sharingDataModel(); as dataModel) {
  <app-data-model-share-dialog
    [dataModel]="dataModel"
    (closed)="closeDataModelShareDialog()"
  />
}
