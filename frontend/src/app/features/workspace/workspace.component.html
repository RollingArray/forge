<section class="workspace-page">
  <div class="workspace-body">
    <main class="center-panel">
      <div class="center-scroll-content">
        <app-workspace-welcome-header
          (newDataModel)="handleNewDataModel()"
        />

        <app-workspace-content
          [metrics]="metrics()"
          [dataModels]="dataModels()"
          [selectedDataModel]="selectedDataModel()"
          (newDataModel)="handleNewDataModel()"
          (dataModelSelected)="handleDataModelSelected($event)"
          (editRequested)="handleDataModelEditRequested($event)"
          (shareRequested)="handleDataModelShareRequested($event)"
          (duplicateRequested)="handleDataModelDuplicateRequested($event)"
        />
      </div>

      <div class="templates-dock">
        <app-workspace-templates
          [templates]="templates()"
          (templateSelected)="handleTemplateSelected($event)"
        />
      </div>
    </main>

    <app-workspace-right-rail
      [activities]="activities()"
        (viewAllActivity)="handleViewAllActivity()"
      (documentationRequested)="handleDocumentation()"
    />
  </div>
</section>

@if (dataModelDialogOpen()) {
  <app-data-model-dialog
    [dataModel]="editingDataModel()"
    [deleteBusy]="savingDataModel()"
    (saved)="handleDataModelSaved($event)"
    (deleted)="handleDataModelDeleted()"
    (closed)="closeDataModelDialog()"
  />
}

@if (dataModelShareDialogOpen() && sharingDataModel(); as dataModel) {
  <app-data-model-share-dialog
    [dataModel]="dataModel"
    (closed)="closeDataModelShareDialog()"
  />
}

@if (duplicateDataModelTarget(); as dataModel) {
  <app-confirmation-dialog
    title="Duplicate this Data Model?"
    message="A separate copy will be created. The original Data Model will remain unchanged."
    icon="content_copy"
    severity="info"
    confirmLabel="Duplicate Data Model"
    cancelLabel="Cancel"
    [subject]="dataModel.name"
    context="Included: complete specification, entities, fields, identity keys, foreign keys, relationships, constraints, description, colour and tags. Excluded: generated datasets, generation jobs, checkpoints and execution history. The copy receives a new Data Model ID and a name beginning with 'Copy of'."
    [busy]="duplicatingDataModel()"
    [error]="duplicateDataModelError()"
    (confirmed)="confirmDataModelDuplication()"
    (cancelled)="cancelDataModelDuplication()"
  />
}
