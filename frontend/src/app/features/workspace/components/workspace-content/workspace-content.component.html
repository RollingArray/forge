<div class="workspace-content">
  <app-workspace-metrics [metrics]="metrics()" />

  <app-workspace-recent-data-models
    [dataModels]="dataModels()"
    [selectedDataModel]="selectedDataModel()"
    (dataModelSelected)="dataModelSelected.emit($event)"
    (shareRequested)="shareRequested.emit($event)"
    (newDataModel)="newDataModel.emit()"
  />

</div>
