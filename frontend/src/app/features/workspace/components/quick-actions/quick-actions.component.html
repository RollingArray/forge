<section class="quick-actions" [class.sidebar-variant]="variant() === 'sidebar'">
  <div class="section-header">
    <div>
      <h2>Quick Actions</h2>
      <p>Start something new</p>
    </div>
  </div>

  <div class="action-list">
    @for (action of actions; track action.action) {
      <button
        type="button"
        class="action-item"
        [class.coming-soon]="action.action !== 'new-dataModel'"
        [disabled]="action.action !== 'new-dataModel'"
        [attr.aria-label]="
          action.action === 'new-dataModel'
            ? action.label
            : action.label + ', Coming Soon'
        "
        (click)="selectAction(action)"
      >
        <span class="action-icon">
          <span class="material-symbols-outlined">{{ action.icon }}</span>
        </span>

        <span class="action-label">{{ action.label }}</span>

        @if (action.action !== 'new-dataModel') {
          <span class="coming-soon-label">Coming Soon</span>
        } @else {
          <span class="material-symbols-outlined action-arrow">
            arrow_forward
          </span>
        }
      </button>
    }
  </div>
</section>
