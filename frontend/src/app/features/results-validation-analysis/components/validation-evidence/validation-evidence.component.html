<app-workspace-section>
  <app-workspace-header
    eyebrow="VALIDATION EVIDENCE"
    title="Deterministic checks"
    summary="Review check outcomes, measured values, and the records included in each validation category."
  />

  <app-workspace-scroll-area>
    <app-content-grid [columns]="3">
      @for (check of visibleChecks(); track check.key) {
        <app-validation-check-card [check]="check" />
      } @empty {
        <app-content-card>
          <section class="empty-evidence-state">
            <h2>No detailed evidence available</h2>
            <p>This job did not persist detailed validation evidence.</p>
          </section>
        </app-content-card>
      }
    </app-content-grid>
  </app-workspace-scroll-area>
</app-workspace-section>
