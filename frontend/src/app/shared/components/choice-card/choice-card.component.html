<button
  type="button"
  class="choice-card"
  [class.selected]="selected()"
  [class.disabled]="disabled()"
  [disabled]="disabled()"
  (click)="select()"
>
  <span class="choice-icon">
    @if (visualText()) {
      <span class="choice-visual-text">{{ visualText() }}</span>
    } @else {
      <span class="material-symbols-outlined">
        {{ icon() }}
      </span>
    }
  </span>

  <span class="choice-copy">
    <strong>{{ title() }}</strong>

    <small>
      {{ description() }}
    </small>
  </span>

  @if (example()) {
    <span class="choice-example visual-example">
      {{ example() }}
    </span>
  }

  <ng-content />
</button>
