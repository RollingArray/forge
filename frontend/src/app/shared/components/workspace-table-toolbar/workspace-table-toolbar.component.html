<div class="workspace-table-toolbar">
  <div class="toolbar-summary">
    @if (summaryIcon()) {
      <span class="material-symbols-outlined">
        {{ summaryIcon() }}
      </span>
    }

    @if (summary()) {
      <span>{{ summary() }}</span>
    }

    <ng-content select="[toolbar-summary-extra]"></ng-content>
  </div>

  <div class="toolbar-actions">
    @for (toolbarFilter of filters(); track toolbarFilter.id) {
      <button
        type="button"
        class="toolbar-filter forge-card"
        [class.toolbar-filter-active]="toolbarFilter.active"
        [class.toolbar-filter-primary]="toolbarFilter.variant === 'primary'"
        [class.toolbar-filter-success]="toolbarFilter.variant === 'success'"
        [class.toolbar-filter-warning]="toolbarFilter.variant === 'warning'"
        [class.toolbar-filter-danger]="toolbarFilter.variant === 'danger'"
        (click)="onFilterChange(toolbarFilter)"
      >
        @if (toolbarFilter.icon) {
          <span class="material-symbols-outlined">
            {{ toolbarFilter.icon }}
          </span>
        }

        <span>{{ toolbarFilter.label }}</span>

        @if (toolbarFilter.count !== undefined) {
          <span class="toolbar-filter-count">
            {{ toolbarFilter.count }}
          </span>
        }
      </button>
    }

    @if (showSearch()) {
      <label class="toolbar-search">
        <span class="material-symbols-outlined"> search </span>

        <input
          type="search"
          [placeholder]="searchPlaceholder()"
          [value]="searchValue()"
          (input)="onSearch($any($event.target).value)"
        />
      </label>
    }

    @for (toolbarAction of actions(); track toolbarAction.id) {
      @if (toolbarAction.useForgeButton) {
        <app-forge-button
          [label]="toolbarAction.label || toolbarAction.id"
          [icon]="toolbarAction.icon"
          [variant]="toolbarAction.variant === 'primary' ? 'primary' : 'secondary'"
          [disabled]="!!toolbarAction.disabled"
          [ariaLabel]="toolbarAction.label || toolbarAction.tooltip || toolbarAction.id"
          [title]="toolbarAction.tooltip || toolbarAction.label || toolbarAction.id"
          (clicked)="onAction(toolbarAction)"
        />
      } @else {
        <button
          type="button"
          class="forge-card toolbar-action"
          [class.toolbar-action-primary]="toolbarAction.variant === 'primary'"
          [class.toolbar-action-danger]="toolbarAction.variant === 'danger'"
          [class.toolbar-action-with-label]="toolbarAction.label"
          [disabled]="toolbarAction.disabled"
          [attr.aria-label]="toolbarAction.label || toolbarAction.tooltip || toolbarAction.id"
          [attr.title]="toolbarAction.tooltip || toolbarAction.label || toolbarAction.id"
          (click)="onAction(toolbarAction)"
        >
          <span class="material-symbols-outlined">
            {{ toolbarAction.icon }}
          </span>

          @if (toolbarAction.label) {
            <span>{{ toolbarAction.label }}</span>
          }
        </button>
      }
    }
    <ng-content select="[toolbar-extra-controls]"></ng-content>
  </div>
</div>
