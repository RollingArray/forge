<footer class="workflow-action-bar">

  <div class="action-context">

    <span class="material-symbols-outlined">
      {{ icon() }}
    </span>

    <div class="action-copy">

      <strong>
        {{ title() }}
      </strong>

      <span>
        {{ description() }}
      </span>

    </div>

  </div>

  <div class="action-buttons">

    @if (secondaryLabel()) {
      <app-forge-button
        [label]="secondaryLabel()"
        [icon]="secondaryIcon()"
        variant="secondary"
        (clicked)="handleSecondaryAction()"
      />
    }

    <app-forge-button
      [label]="primaryLabel()"
      [icon]="primaryIcon()"
      variant="primary"
      [disabled]="primaryDisabled()"
      (clicked)="handlePrimaryAction()"
    />

  </div>

</footer>
