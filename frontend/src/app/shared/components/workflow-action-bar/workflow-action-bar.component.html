<footer class="workflow-action-bar">

  <div class="action-context">

    <span class="material-symbols-outlined">
      {{ icon() }}
    </span>

    <div class="action-copy">

      <strong>
        {{ title() }}
      </strong>

      <span>
        {{ description() }}
      </span>

    </div>

  </div>

  <div class="action-buttons">

    @if (secondaryLabel()) {
      <app-forge-button
        [label]="secondaryLabel()"
        [icon]="secondaryIcon()"
        variant="secondary"
        (clicked)="handleSecondaryAction()"
      />
    }

    @if (contextualActionLabel()) {
      <app-forge-button
        [label]="contextualActionLabel()"
        [icon]="contextualActionIcon()"
        variant="primary"
        [disabled]="contextualActionDisabled()"
        (clicked)="handleContextualAction()"
      />
    }

    @if (primaryLabel()) {
      <app-forge-button
        [label]="primaryLabel()"
        [icon]="primaryIcon()"
        [variant]="contextualActionLabel() ? 'secondary' : 'primary'"
        [disabled]="primaryDisabled()"
        (clicked)="handlePrimaryAction()"
      />
    }

  </div>

</footer>
