<tr>
  <td
    style="

      background-color: #fbfaf8;

  >

      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <!-- Organization logo: top row, right-aligned -->
      <tr>
        <td align="right" style="padding: 0 0 24px">
          <img
            src="cid:collins-logo"
            width="165"

              width: 165px;
              max-width: 100%;
              height: auto;
              border: 0;
            "
          />

      <!-- FORGE branding: icon column and text column -->

        <td align="left">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0">

                  </tr>
                  <tr>
                    <td
